<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        //FOR...best used when you know the number of iterations in advance 
    let studentList=["astha","kashish","eshita","sneha","shiva"];
    for(let i=0; i<studentList.length;i++){
        console.log(studentList[i]);
    }
    //wHILE... used when the number of iterations is uncertain, and the loop 
    let x=0;
    while(x<studentList.length){
        console.log(studentList[x]);
        x++
    }
    //FOR... of loop
    //iterates over the values of iterable object (like, array, strings, maps and sets).
    

    </script>
</body>
</html>
